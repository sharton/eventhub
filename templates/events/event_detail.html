{% extends "base.html" %}

{% block title %}EventHub | {{ event.title }}{% endblock %}

{% block content %}
<section class="page-shell">
    <div class="container">
        <article class="detail-card">
            {% if event.poster %}
            <!-- Картинка загружается автоматически, если она прикреплена -->
            <img src="{{ event.poster.url }}" alt="{{ event.title }}" class="detail-poster">
            {% endif %}

            <h1>{{ event.title }}</h1>
            <p class="event-date">{{ event.starts_at|date:"d E Y, H:i" }}</p>
            <p><strong>{{ event.summary }}</strong></p>
            <p>{{ event.description }}</p>

            <div class="detail-actions" style="margin-top: 20px;">
                <a href="{% url 'events:event_list' %}" class="feature-link">← Назад к событиям</a>
            </div>
        </article>
    </div>
</section>
{% endblock %}
